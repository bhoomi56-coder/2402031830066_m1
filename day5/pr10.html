<!DOCTYPE html>
<html>
<head>
  <title>Multiplication Table</title>
</head>
<body>
  <h2>Multiplication Table of 5</h2>
  <script>
    let num = 5; // fixed number
    for (let i = 1; i <= 10; i++) {
      document.write(num + " x " + i + " = " + (num * i) + "<br>");
    }
  </script>
</body>
</html>
