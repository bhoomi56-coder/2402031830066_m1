<!DOCTYPE html>
<html>
<head>
    <title>Reverse String Example</title>
</head>
<body>

<h2>Reverse a String using Loop</h2>

<script>
    let str = "Hello";
    let reversed = "";
    let i = str.length - 1;

    while (i >= 0) {
        reversed += str[i];
        i--;
    }

    document.write("Original String: " + str + "<br>");
    document.write("Reversed String: " + reversed);
</script>

</body>
</html>
