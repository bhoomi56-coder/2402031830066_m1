<!DOCTYPE html>
<html>
<head>
    <title>Display Student Names</title>
</head>
<body>

<h2>Display Student Names using Loop</h2>

<script>
    let students = ["Rahul", "Priya", "Amit", "Sneha", "Karan"];
    let i = 0;

    while (i < students.length) {
        document.write(students[i] + "<br>");
        i++;
    }
</script>

</body>
</html>
