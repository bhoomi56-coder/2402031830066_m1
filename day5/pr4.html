<!DOCTYPE html>
<html>
<head>
    <title>Total Marks Using Loop</title>
</head>
<body>

<h2>Calculate Total Marks using Loop</h2>

<script>
    let marks = [85, 90, 78, 88, 92];
    let total = 0;
    let i = 0;

    while (i < marks.length) {
        total += marks[i];
        i++;
    }

    document.write("Marks: " + marks + "<br><br>");
    document.write("Total Marks: " + total);
</script>

</body>
</html>
