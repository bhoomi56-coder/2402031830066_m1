<!DOCTYPE html>
<html>
<head>
    <title>Display Array Elements</title>
</head>
<body>

<h2>Display Array Elements using Loop</h2>

<script>
    let fruits = ["Apple", "Banana", "Mango", "Orange"];
    let i = 0;

    while (i < fruits.length) {
        document.write(fruits[i] + "<br>");
        i++;
    }
</script>

</body>
</html>
