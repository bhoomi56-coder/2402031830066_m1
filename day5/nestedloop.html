<!DOCTYPE html>
<html>
<head>
  <title>Star Pattern</title>
</head>
<body>
  <h2>Star Pattern</h2>
  <script>
    for (let i = 1; i <= 5; i++) {
      let stars = "";
      for (let j = 1; j <= i; j++) {
        stars += "*";
      }
      document.write(stars + "<br>");
    }
  </script>
</body>
</html>
