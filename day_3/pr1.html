
<!DOCTYPE html>
<html>
<head>
    <title>Nested List Example</title>
</head>
<body>
    <h2>Nested List Example</h2>

    <!-- Ordered list -->
    <ol>
        <li>Fruits
            <!-- Unordered list inside ordered list -->
            <ul>
                <li>Apple</li>
                <li>Banana</li>
                <li>Mango</li>
            </ul>
        </li>
        <li>Vegetables
            <!-- Unordered list inside ordered list -->
            <ul>
                <li>Carrot</li>
                <li>Potato</li>
                <li>Tomato</li>
            </ul>
        </li>
        <li>Dairy Products
            <!-- Unordered list inside ordered list -->
            <ul>
                <li>Milk</li>
                <li>Cheese</li>
                <li>Butter</li>
            </ul>
        </li>
    </ol>
</body>
</html>
