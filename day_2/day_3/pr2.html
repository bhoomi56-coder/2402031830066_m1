<!DOCTYPE html>
<html>
<head>
    <title>TD Tag Example</title>
</head>
<body>
    <h2>Using the &lt;td&gt; Tag</h2>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>1</td>   <!-- Table Data Cell -->
            <td>Rahul</td>
            <td>85</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Priya</td>
            <td>90</td>
        </tr>
    </table>
</body>
</html>
