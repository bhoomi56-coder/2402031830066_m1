<!DOCTYPE html>
<html>
<head>
    <title>Creative Grid Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .grid-container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 60px;
            height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #2ecc71;
            padding: 20px;
            color: white;
        }

        .content {
            grid-area: content;
            background-color: #ecf0f1;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: #e74c3c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Creative look: cards inside content */
        .card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="header">🌐 My Creative Grid Layout</div>
        <div class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </div>
        <div class="content">
            <h2>Welcome!</h2>
            <div class="card">This is a card styled with shadow and rounded corners.</div>
            <div class="card">CSS Grid makes layouts simple and powerful.</div>
            <div class="card">You can easily adjust rows and columns.</div>
        </div>
        <div class="footer">© 2026 Creative Grid Layout</div>
    </div>
</body>
</html>
